<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ স্ট্রিমিং - ২০২৬ বিশ্বকাপ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> <!-- আগের স্টাইল ফাইল -->
    <style>
        .live-container { max-width: 800px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        .scoreboard { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; background: #011f4b; color: white; padding: 30px; border-radius: 10px; }
        .team-box img { width: 80px; height: 80px; object-fit: contain; }
        .score { font-size: 48px; font-weight: bold; color: #ffd700; }
        .live-status { background: red; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .stream-section { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .official-btn { display: inline-block; background: #28a745; color: white; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); transition: 0.3s; }
        .official-btn:hover { background: #218838; transform: translateY(-3px); }
        .venue-info { color: #666; margin-top: 10px; }

        .match-quick-links {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

.link-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #555;
    font-size: 13px;
    transition: 0.3s;
    flex: 1;
}

.link-item i {
    font-size: 20px;
    margin-bottom: 5px;
    color: #011f4b; /* আপনার থিমের নীল রঙ */
    background: #f0f4f8;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: 0.3s;
}

.link-item:hover i {
    background: #011f4b;
    color: #ffd700; /* হোভারে গোল্ডেন রঙ */
    transform: translateY(-3px);
}

.link-item span {
    font-weight: 500;
}

/* মোবাইলের জন্য গ্যাপ ঠিক করা */
@media (max-width: 480px) {
    .match-quick-links {
        gap: 5px;
    }
    .link-item span {
        font-size: 11px;
    }
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo" onclick="location.href='index.html'" style="cursor:pointer">
                <i class="fas fa-futbol"></i> World Cup 2026
            </h1>
        </div>
    </nav>

    <div class="live-container">
        <div id="match-header">
            <span class="live-status" id="status-tag">UPCOMING</span>
            <h2 id="match-title" style="margin-top:15px;">ম্যাচের তথ্য লোড হচ্ছে...</h2>
        </div>

        <!-- স্কোরবোর্ড -->
        <div class="scoreboard">
            <div class="team-box">
                <img id="teamA-logo" src="https://via.placeholder.com/80" alt="Team A">
                <h3 id="teamA-name">Team 1</h3>
            </div>
            <div class="score" id="main-score">0 - 0</div>
            <div class="team-box">
                <img id="teamB-logo" src="https://via.placeholder.com/80" alt="Team B">
                <h3 id="teamB-name">Team 2</h3>
            </div>
        </div>

        <p class="venue-info"><i class="fas fa-map-marker-alt"></i> <span id="match-venue">ভেন্যু লোড হচ্ছে...</span></p>

        <!-- কুইক লিঙ্ক সেকশন -->
<div class="match-quick-links">
    <!-- লাইনআপ বাটনে ম্যাচ আইডি পাঠাতে হবে -->
    <a id="lineup-link" href="#" class="link-item">
        <i class="fas fa-users"></i>
        <span>লাইনআপ</span>
    </a>
    <a href="points.html" class="link-item">
        <i class="fas fa-table"></i>
        <span>পয়েন্ট টেবিল</span>
    </a>
    <a href="index.html" class="link-item">
        <i class="fas fa-calendar-alt"></i>
        <span>আরও ম্যাচ</span>
    </a>
</div>

<!-- গোলদাতা ও মিনিটের জন্য টাইমলাইন -->
<div id="timeline" class="match-events">
    <!-- এখানে জাভাস্ক্রিপ্ট গোলদাতার নাম বসাবে -->
</div>
        <!-- স্ট্রিমিং সেকশন -->
        <div class="stream-section" id="stream-area">
            <h3>লাইভ স্ট্রিমিং দেখুন</h3>
            <p style="margin-bottom: 20px;">অফিসিয়াল ব্রডকাস্টার চ্যানেলে খেলা দেখতে নিচের বাটনে ক্লিক করুন:</p>
            <a href="#" id="stream-link" class="official-btn" target="_blank">
                <i class="fas fa-play-circle"></i> Click to Watch Live
            </a>
            <p id="not-live-msg" style="display:none; color: red; font-weight: bold; margin-top: 20px;">
                খেলাটি এখনো শুরু হয়নি। শুরু হলে বাটনটি সক্রিয় হবে।
            </p>
        </div>
    </div>

<script>
    // ১. URL থেকে আইডি নেওয়া
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id');

    async function fetchMatchDetails() {
        if (!matchId) {
            document.getElementById('match-title').innerText = "ম্যাচ পাওয়া যায়নি!";
            return;
        }

        try {
            const response = await fetch(`/api/match/${matchId}`);
            const match = await response.json();

            // ২. বেসিক তথ্য বসানো (টিম নাম, পতাকা, ভেন্যু)
            document.getElementById('match-title').innerText = `${match.teamA} বনাম ${match.teamB}`;
            if(match.teamAFlag) document.getElementById('teamA-logo').src = match.teamAFlag;
            if(match.teamBFlag) document.getElementById('teamB-logo').src = match.teamBFlag;
            document.getElementById('match-venue').innerText = match.venue;

            // ৩. মেইন স্কোরবোর্ড আপডেট (নতুন যোগ করা হয়েছে)
            const scoreElement = document.getElementById('main-score');
            if (scoreElement) {
                scoreElement.innerText = `${match.scoreA || 0} - ${match.scoreB || 0}`;
            }

            // ৪. টাইমলাইন বা গোলদাতার তালিকা আপডেট (নতুন যোগ করা হয়েছে)
            const timeline = document.getElementById('timeline');
            if (timeline) {
                timeline.innerHTML = "<h4>ম্যাচ ইভেন্ট (Events)</h4>";
                if (match.events && match.events.length > 0) {
                    match.events.forEach(event => {
                        // টাইপ অনুযায়ী আইকন সেট করা
                        let icon = '🔔';
                        if(event.type === 'Goal') icon = '⚽';
                        else if(event.type.includes('Yellow Card')) icon = '🟨';
                        else if(event.type.includes('Red Card')) icon = '🟥';
                        
                        timeline.innerHTML += `<p>${icon} ${event.player} - ${event.minute}'</p>`;
                    });
                } else {
                    timeline.innerHTML += "<p>এখনো কোনো গোল বা ইভেন্টের তথ্য নেই</p>";
                }
            }

            // ৫. লাইভ স্ট্যাটাস চেক এবং বাটন কন্ট্রোল
            const statusTag = document.getElementById('status-tag');
            const streamLink = document.getElementById('stream-link');
            const notLiveMsg = document.getElementById('not-live-msg');
            const lineupLink = document.getElementById('lineup-link');

            if (match.isLive) {
                // যদি লাইভ থাকে
                statusTag.innerText = "🔴 LIVE";
                statusTag.style.background = "red";
                streamLink.style.display = "inline-block"; 
                streamLink.href = match.officialStreamUrl; 
                notLiveMsg.style.display = "none"; 
                if(lineupLink) lineupLink.href = `lineup.html?id=${matchId}`;
            } else {
                // যদি লাইভ না থাকে
                statusTag.innerText = "UPCOMING";
                statusTag.style.background = "#555";
                streamLink.style.display = "none"; 
                notLiveMsg.style.display = "block"; 
                if(lineupLink) lineupLink.href = `lineup.html?id=${matchId}`;
            }

        } catch (error) {
            console.error("Error fetching match:", error);
        }
    }

    // প্রতি ৩০ সেকেন্ড পরপর তথ্য আপডেট করা
    setInterval(fetchMatchDetails, 30000);

    // পেজ লোড হওয়ার সাথে সাথে ফাংশনটি প্রথমবার চালানো
    fetchMatchDetails();

    // এক্সট্রা চেক: লাইনআপ বাটনের জন্য আইডি সেট করা
    if (matchId) {
        const lineupBtn = document.getElementById('lineup-link');
        if (lineupBtn) {
            lineupBtn.href = `lineup.html?id=${matchId}`;
        }
    }
</script>
</body>
</html>
